<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPLAY - Streaming Anime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        background: '#0a0d14',
                        surface: '#121722',
                        primary: '#1E90FF',
                        secondary: '#1A2235'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0d14; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hero-grad { background: linear-gradient(180deg, rgba(10,13,20,0) 0%, rgba(10,13,20,0.6) 50%, #0a0d14 100%); }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-white">

    <!-- Kerangka Landing Page langsung dirender tanpa menunggu API -->
    <div id="app" class="w-full min-h-screen relative pb-24">
        <!-- Navbar Langsung Muncul -->
        <nav class="absolute top-0 w-full z-50 px-4 py-5 md:px-12 flex justify-between items-center bg-gradient-to-b from-black/90 to-transparent">
            <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
                <i data-lucide="play" class="text-primary fill-primary w-7 h-7 md:w-8 md:h-8"></i>
                <span class="text-xl md:text-2xl font-extrabold tracking-wide">TPLAY</span>
            </div>
        </nav>

        <!-- Container Konten Utama -->
        <div id="main-content" class="pt-20">
            <div id="section-new" class="px-4 md:px-12 mt-4">
                <h2 class="text-lg md:text-xl font-bold flex items-center gap-2 mb-4">
                    <i data-lucide="flame" class="text-[#FF4500] fill-[#FF4500]"></i> Rilis Terbaru
                </h2>
                <div id="list-new" class="flex overflow-x-auto gap-3 hide-scroll pb-4">
                    <p class="text-xs text-gray-500 animate-pulse">Memuat data latar belakang...</p>
                </div>
            </div>

            <div id="section-ongoing" class="px-4 md:px-12 mt-8">
                <h2 class="text-lg md:text-xl font-bold flex items-center gap-2 mb-4">
                    <i data-lucide="film" class="text-primary"></i> On Going Anime
                </h2>
                <div id="list-ongoing" class="flex overflow-x-auto gap-3 hide-scroll pb-4">
                    <p class="text-xs text-gray-500 animate-pulse">Memuat data latar belakang...</p>
                </div>
            </div>

            <div id="section-completed" class="px-4 md:px-12 mt-8">
                <h2 class="text-lg md:text-xl font-bold flex items-center gap-2 mb-4">
                    <i data-lucide="check-circle" class="text-green-500"></i> Completed Anime
                </h2>
                <div id="list-completed" class="flex overflow-x-auto gap-3 hide-scroll pb-4">
                    <p class="text-xs text-gray-500 animate-pulse">Memuat data latar belakang...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.animekudesu.web.id';

        function goHome() {
            window.location.reload();
        }

        function extractSlug(link) {
            if(!link) return '';
            return link.split('/').filter(Boolean).pop();
        }

        // Render elemen kartu anime secara dinamis
        function populateList(elementId, dataArray) {
            const container = document.getElementById(elementId);
            if (!container) return;
            
            if (!dataArray || dataArray.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500">Data gagal dimuat (CORS / Jaringan)</p>`;
                return;
            }

            container.innerHTML = dataArray.map(anime => `
                <div class="w-[140px] md:w-[180px] shrink-0 relative cursor-pointer group snap-start" onclick="loadDetail('${extractSlug(anime.slug || anime.link)}')">
                    <div class="overflow-hidden rounded-xl border border-gray-800 aspect-[3/4] relative bg-secondary">
                        <img src="${anime.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="Poster">
                        <div class="absolute top-2 right-2 bg-black/80 backdrop-blur-sm px-2 py-0.5 rounded text-[10px] font-bold border border-gray-700">
                            ${anime.type || 'TV'}
                        </div>
                    </div>
                    <h3 class="mt-2 font-semibold text-sm line-clamp-1 group-hover:text-primary transition">${anime.title}</h3>
                    <p class="text-xs text-gray-400 mt-1">${anime.episode || 'Ep ?'} • ⭐ ${anime.score || '-'}</p>
                </div>
            `).join('');
            
            if (window.lucide) window.lucide.createIcons();
        }

        // Tarik API di latar belakang (Background Fetch) setelah halaman terbuka
        async function backgroundFetch() {
            try {
                // Fetch Rilis Terbaru
                fetch(`${API_URL}/new-anime`)
                    .then(res => res.json())
                    .then(d => populateList('list-new', d.data))
                    .catch(() => document.getElementById('list-new').innerHTML = '<p class="text-xs text-red-400">Gagal memuat API</p>');

                // Fetch On Going
                fetch(`${API_URL}/ongoing-anime`)
                    .then(res => res.json())
                    .then(d => populateList('list-ongoing', d.data))
                    .catch(() => document.getElementById('list-ongoing').innerHTML = '<p class="text-xs text-red-400">Gagal memuat API</p>');

                // Fetch Completed
                fetch(`${API_URL}/completed-anime`)
                    .then(res => res.json())
                    .then(d => populateList('list-completed', d.data))
                    .catch(() => document.getElementById('list-completed').innerHTML = '<p class="text-xs text-red-400">Gagal memuat API</p>');

            } catch (err) {
                console.error("Background fetch error:", err);
            }
        }

        async function loadDetail(slug) {
            const content = document.getElementById('main-content');
            content.innerHTML = `<div class="h-[70vh] flex flex-col items-center justify-center"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-primary mb-2"></i><p class="text-xs text-gray-400">Memuat detail anime...</p></div>`;
            if (window.lucide) window.lucide.createIcons();

            try {
                const res = await fetch(`${API_URL}/detail-anime/${slug}`);
                if (!res.ok) throw new Error('Gagal mengambil detail');
                const anime = await res.json();
                const episodes = anime.episodes || [];
                const tags = anime.genres ? anime.genres.map(g => g.tag) : [];

                content.innerHTML = `
                    <div class="relative w-full h-[50vh] bg-black overflow-hidden">
                        <img src="${anime.img}" class="absolute inset-0 w-full h-full object-cover opacity-50" alt="Poster">
                        <div class="absolute inset-0 hero-grad z-10"></div>
                        <div class="absolute top-4 left-4 z-50">
                            <button onclick="goHome()" class="w-10 h-10 bg-black/50 rounded-full flex items-center justify-center hover:bg-black/80 transition">
                                <i data-lucide="arrow-left" class="w-5 h-5 text-white"></i>
                            </button>
                        </div>
                    </div>
                    <div class="px-4 md:px-12 max-w-4xl mx-auto -mt-10 relative z-30">
                        <h1 class="text-3xl md:text-5xl font-extrabold mb-1 text-white">${anime.japanese_title || anime.title}</h1>
                        <p class="text-sm text-gray-400 mb-4">${anime.title} Sub Indo</p>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${tags.map(t => `<span class="bg-secondary px-3 py-1 rounded-full text-xs text-gray-300">${t}</span>`).join('')}
                        </div>
                        <p class="text-sm text-gray-300 mb-8">${anime.descriptions ? anime.descriptions.join('<br>') : ''}</p>
                        <h3 class="font-bold text-lg mb-4">Daftar Episode (${episodes.length})</h3>
                        <div class="flex flex-col gap-2">
                            ${episodes.map(ep => `
                                <div class="p-3 bg-secondary rounded-xl flex justify-between items-center cursor-pointer hover:bg-gray-800 transition">
                                    <span class="font-semibold text-sm">${ep.title}</span>
                                    <span class="text-xs text-gray-400">Episode ${ep.episode}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                if (window.lucide) window.lucide.createIcons();
            } catch (err) {
                content.innerHTML = `<div class="p-12 text-center"><p class="text-red-400 mb-4">Gagal memuat detail anime.</p><button onclick="goHome()" class="bg-primary px-6 py-2 rounded-full text-white font-bold">Kembali</button></div>`;
            }
        }

        // Halaman langsung tampil tanpa menunggu fetch selesai
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
            backgroundFetch(); // API ditarik di latar belakang
        });
    </script>
</body>
</html>
