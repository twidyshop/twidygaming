<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPLAY - Streaming Anime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        background: '#0a0d14',
                        surface: '#121722',
                        primary: '#1E90FF',
                        secondary: '#1A2235'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0d14; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hero-grad { background: linear-gradient(180deg, rgba(10,13,20,0) 0%, rgba(10,13,20,0.6) 50%, #0a0d14 100%); }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-white">

    <div id="app" class="w-full min-h-screen relative pb-20 md:pb-0"></div>

    <script>
        const API_URL = 'https://api.animekudesu.web.id';
        
        const state = {
            view: 'home',
            isLoading: true,
            error: null,
            homeData: { newAnime: [], ongoing: [], completed: [], genres: [] },
            detail: null,
            activeVideo: { isLoading: false, url: null, error: null }
        };

        const ICONS = { 'Action': 'swords', 'Adventure': 'map', 'Comedy': 'smile', 'Fantasy': 'sparkles', 'Romance': 'heart' };

        // --- FETCH LOGIC ---
        async function fetchHomeData() {
            state.isLoading = true; state.error = null; render();
            try {
                // Menarik semua API beranda sekaligus
                const [newRes, ongoingRes, completedRes, genreRes] = await Promise.all([
                    fetch(`${API_URL}/new-anime`).catch(() => null),
                    fetch(`${API_URL}/ongoing-anime`).catch(() => null),
                    fetch(`${API_URL}/completed-anime`).catch(() => null),
                    fetch(`${API_URL}/genres`).catch(() => null)
                ]);

                if (newRes && newRes.ok) { const d = await newRes.json(); state.homeData.newAnime = d.data || []; }
                if (ongoingRes && ongoingRes.ok) { const d = await ongoingRes.json(); state.homeData.ongoing = d.data || []; }
                if (completedRes && completedRes.ok) { const d = await completedRes.json(); state.homeData.completed = d.data || []; }
                if (genreRes && genreRes.ok) { const d = await genreRes.json(); state.homeData.genres = d.data || []; }

                state.view = 'home';
                state.activeVideo = { isLoading: false, url: null, error: null };
            } catch (err) {
                state.error = err.message;
            } finally {
                state.isLoading = false;
                render();
            }
        }

        async function fetchDetailData(slug) {
            state.isLoading = true; state.error = null; state.view = 'detail';
            state.activeVideo = { isLoading: false, url: null, error: null };
            window.scrollTo(0, 0); render();
            
            try {
                const res = await fetch(`${API_URL}/detail-anime/${slug}`);
                if (!res.ok) throw new Error('Gagal menghubungi API Detail Anime');
                
                state.detail = await res.json();
            } catch (err) {
                state.error = err.message;
            } finally {
                state.isLoading = false;
                render();
            }
        }

        // Logika sesuai file page.tsx (11).txt -> getPageData()[span_4](start_span)[span_4](end_span)
        async function playEpisode(detailEpsUrl) {
            state.activeVideo = { isLoading: true, url: null, error: null };
            render(); 
            
            try {
                // 1. Dapatkan detail episode untuk mencari daftar video
                const epsRes = await fetch(`${API_URL}${detailEpsUrl}`);
                if (!epsRes.ok) throw new Error('Gagal mengambil data episode');
                const epsData = await epsRes.json();
                
                // 2. Ambil path server video pertama (sesuai `details?.videos?.[0]?.video`)[span_5](start_span)[span_5](end_span)
                const videoPath = epsData?.videos?.[0]?.video;
                if (!videoPath) throw new Error('Server video belum tersedia.');

                // 3. Dapatkan URL iframe asli dari server video
                const vidRes = await fetch(`${API_URL}${videoPath}`);
                if (!vidRes.ok) throw new Error('Gagal mendapatkan link video.');
                const vidData = await vidRes.json();
                
                if (!vidData.url) throw new Error('URL video kosong.');

                state.activeVideo = { isLoading: false, url: vidData.url, error: null };
            } catch (err) {
                state.activeVideo = { isLoading: false, url: null, error: err.message };
            } finally {
                render();
                document.getElementById('video-player-area')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function extractSlug(link) {
            if(!link) return '';
            return link.split('/').filter(Boolean).pop();
        }

        // --- UI COMPONENTS ---
        
        // (UI Beranda disingkat untuk fokus pada Detail, namun tetap dinamis memanggil list horizontal)
        function renderHorizontalList(title, dataArray, iconName, iconColor) {
            if (!dataArray || dataArray.length === 0) return '';
            return `
                <div class="px-4 md:px-12 mt-8">
                    <h2 class="text-lg md:text-xl font-bold flex items-center gap-2 mb-4">
                        <i data-lucide="${iconName}" class="${iconColor}"></i> ${title}
                    </h2>
                    <div class="flex overflow-x-auto gap-3 hide-scroll pb-4 snap-x">
                        ${dataArray.map((anime) => `
                            <div class="w-[140px] md:w-[180px] shrink-0 relative cursor-pointer group snap-start" onclick="fetchDetailData('${extractSlug(anime.slug || anime.link)}')">
                                <div class="overflow-hidden rounded-xl border border-gray-800 aspect-[3/4] relative bg-secondary">
                                    <img src="${anime.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                </div>
                                <h3 class="mt-2 font-semibold text-sm line-clamp-1 group-hover:text-primary transition">${anime.title}</h3>
                                <p class="text-xs text-gray-400 mt-1">${anime.episode \vert{}\vert{} 'Ep ?'} • ⭐ ${anime.score || '-'}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Desain halaman Detail persis dengan screenshot 75689.png[span_6](start_span)[span_6](end_span)
        function renderDetail() {
            const anime = state.detail;
            if (!anime) return '';

            const episodes = anime.episodes || [];
            
            // Render area video[span_7](start_span)[span_7](end_span)
            let videoAreaHTML = '';
            if (state.activeVideo.isLoading) {
                videoAreaHTML = `<div class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 z-20"><i data-lucide="loader-2" class="w-10 h-10 animate-spin text-primary mb-2"></i><p class="text-gray-300 text-sm">Memuat video...</p></div>`;
            } else if (state.activeVideo.error) {
                videoAreaHTML = `<div class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-20 px-4 text-center"><p class="text-red-400 font-medium mb-1">Video Gagal Dimuat</p><p class="text-gray-400 text-sm">${state.activeVideo.error}</p></div>`;
            } else if (state.activeVideo.url) {
                videoAreaHTML = `<iframe src="${state.activeVideo.url}" class="absolute inset-0 w-full h-full border-0 z-20" allowfullscreen loading="lazy"></iframe>`;
            } else {
                // Tombol Play besar di tengah[span_8](start_span)[span_8](end_span)
                videoAreaHTML = `
                    <div class="absolute inset-0 flex items-center justify-center z-20">
                        <button onclick="${episodes.length > 0 ? `playEpisode('${episodes[0].detail_eps}')` : ''}" class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center hover:bg-primary/80 transition group border border-white/10 shadow-lg">
                            <i data-lucide="play" class="w-8 h-8 fill-primary text-primary group-hover:fill-white group-hover:text-white transition-colors translate-x-0.5"></i>
                        </button>
                    </div>
                `;
            }

            return `
                <div class="bg-background min-h-screen pb-20">
                    <!-- Tombol Back[span_9](start_span)[span_9](end_span) -->
                    <div class="fixed top-0 w-full z-50 p-4">
                        <button onclick="fetchHomeData()" class="w-10 h-10 bg-black/50 rounded-full backdrop-blur-sm flex items-center justify-center hover:bg-black/80 transition">
                            <i data-lucide="arrow-left" class="w-5 h-5 text-white"></i>
                        </button>
                    </div>

                    <!-- Area Video/Poster -->
                    <div id="video-player-area" class="relative w-full h-[55vh] md:h-[70vh] bg-black overflow-hidden">
                        <img src="${anime.img}" class="absolute inset-0 w-full h-full object-cover opacity-50" alt="Poster">
                        <div class="absolute inset-0 hero-grad z-10"></div>
                        ${videoAreaHTML}
                    </div>

                    <!-- Info Konten[span_10](start_span)[span_10](end_span) -->
                    <div class="px-4 md:px-12 max-w-4xl mx-auto -mt-10 relative z-30">
                        <h1 class="text-3xl md:text-5xl font-extrabold mb-1 text-white drop-shadow-md">${anime.japanese_title || anime.title}</h1>
                        <p class="text-sm text-gray-400 mb-5 font-medium">${anime.title} Sub Indo</p>
                        
                        <!-- Tags[span_11](start_span)[span_11](end_span) -->
                        <div class="flex flex-wrap gap-2 mb-5">
                            ${(anime.genres || []).map(g => `<span class="bg-secondary/80 border border-gray-700/50 px-4 py-1.5 rounded-full text-xs font-semibold text-gray-300">${g.tag}</span>`).join('')}
                        </div>
                        
                        <!-- Stats Bar (Sama persis dengan gambar)[span_12](start_span)[span_12](end_span) -->
                        <div class="flex flex-wrap items-center gap-3 text-xs md:text-sm text-gray-300 mb-6 font-medium">
                            <span class="flex items-center gap-1 text-yellow-500 font-bold"><i data-lucide="star" class="w-4 h-4 fill-yellow-500"></i> ${anime.rating || '-'}</span>
                            <span class="text-gray-600">|</span>
                            <span>${anime.type || 'TV'}</span>
                            <span class="text-gray-600">|</span>
                            <span>Status: ${anime.status || 'Unknown'}</span>
                            <span class="text-gray-600">|</span>
                            <span>Studio: ${anime.studio || '-'}</span>
                        </div>

                        <!-- Synopsis[span_13](start_span)[span_13](end_span) -->
                        <p class="text-sm text-gray-300 mb-10 leading-relaxed">
                            ${anime.descriptions ? anime.descriptions.join('<br><br>') : 'Tidak ada sinopsis.'}
                        </p>

                        <!-- Daftar Episode Header[span_14](start_span)[span_14](end_span) -->
                        <div class="flex items-center gap-2 mb-4">
                            <i data-lucide="list-video" class="w-5 h-5 text-primary"></i>
                            <h3 class="font-bold text-lg text-white">Daftar Episode</h3>
                        </div>

                        <!-- List Semua Episode (Looping dari anime.episodes) -->
                        <div class="flex flex-col gap-3">
                            ${episodes.map((ep) => `
                                <div onclick="playEpisode('${ep.detail_eps}')" class="flex items-center gap-4 p-2 rounded-xl hover:bg-secondary/50 transition cursor-pointer group">
                                    <div class="relative w-32 aspect-video rounded-lg overflow-hidden shrink-0 bg-gray-900 border border-gray-800">
                                         <img src="${anime.img}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition">
                                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                                            <i data-lucide="play-circle" class="w-8 h-8 text-white opacity-80 group-hover:text-primary transition group-hover:scale-110"></i>
                                        </div>
                                    </div>
                                    <div class="flex-1 min-w-0 pr-2">
                                        <h4 class="font-bold text-sm text-gray-200 group-hover:text-white truncate mb-1">
                                            ${ep.title}
                                        </h4>
                                        <p class="text-xs text-gray-500 font-medium">Episode ${ep.episode}</p>
                                    </div>
                                </div>
                            `).join('')}
                            ${episodes.length === 0 ? '<p class="text-sm text-gray-500 py-4">Belum ada episode.</p>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Controller
        function render() {
            const app = document.getElementById('app');
            if (state.isLoading) {
                app.innerHTML = `<div class="h-screen flex flex-col items-center justify-center"><i data-lucide="loader-2" class="w-10 h-10 animate-spin text-primary mb-4"></i><p class="text-gray-400 text-sm">Menghubungkan ke API...</p></div>`;
            } else if (state.error) {
                app.innerHTML = `<div class="h-screen flex flex-col items-center justify-center px-4 text-center"><i data-lucide="triangle-alert" class="w-16 h-16 text-red-500 mb-4"></i><h2 class="text-xl font-bold mb-2">Gagal Memuat Data</h2><p class="text-gray-400 text-sm mb-6">${state.error}</p><button onclick="fetchHomeData()" class="bg-primary px-8 py-2.5 rounded-full font-bold text-white">Coba Lagi</button></div>`;
            } else if (state.view === 'home') {
                app.innerHTML = `
                    <div class="p-4 flex items-center gap-2"><i data-lucide="play" class="w-8 h-8 text-primary fill-primary"></i><span class="text-2xl font-bold">TPLAY</span></div>
                    ${renderHorizontalList('Rilis Terbaru', state.homeData.newAnime, 'flame', 'text-[#FF4500] fill-[#FF4500]')}
                    ${renderHorizontalList('Sedang Tayang', state.homeData.ongoing, 'film', 'text-primary')}
                    ${renderHorizontalList('Tamat (Completed)', state.homeData.completed, 'check-circle', 'text-green-500')}
                `;
            } else if (state.view === 'detail') {
                app.innerHTML = renderDetail();
            }
            lucide.createIcons();
        }

        fetchHomeData();
    </script>
</body>
</html>
